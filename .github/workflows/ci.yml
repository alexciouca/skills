name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Caches Gradle dependencies and checks the wrapper jar is the official one.
      - uses: gradle/actions/setup-gradle@v4

      # ciVerify runs build, which runs check and test.
      - run: ./gradlew ciVerify

      # Keep the test report when something fails, to see which check broke.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test/
